/* Barvy převzaté z webu movitech.cz: azurová #70cfe3, tmavá #1e2226, šedé #f1f4f7 a #e1e3e8 */
:root {
  color-scheme: light;
  --paper: #f1f4f7;
  --sheet: #ffffff;
  --ink: #1e2226;
  --ink-soft: #56646e;
  --rule: #e1e3e8;
  --signal: #70cfe3;
  --signal-hover: #5cc3d9;
  --signal-edge: #2fa6c0;
  --on-signal: #1e2226;
  --danger: #e03363;
  --hatch: rgba(30, 34, 38, .16);
  --tube-hi: #dfe4e8;
  --tube-lo: #6b7882;
  --display: "Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #16191b;
    --sheet: #1e2226;
    --ink: #eceef0;
    --ink-soft: #a2aeb6;
    --rule: #323c46;
    --signal-hover: #8adaeb;
    --signal-edge: #3a97ab;
    --danger: #f2708f;
    --hatch: rgba(236, 238, 240, .20);
    --tube-hi: #b3bdc3;
    --tube-lo: #4f5e68;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #16191b;
  --sheet: #1e2226;
  --ink: #eceef0;
  --ink-soft: #a2aeb6;
  --rule: #323c46;
  --signal-hover: #8adaeb;
  --signal-edge: #3a97ab;
  --danger: #f2708f;
  --hatch: rgba(236, 238, 240, .20);
  --tube-hi: #b3bdc3;
  --tube-lo: #4f5e68;
}
/* hliník je světlejší než ocel */
body[data-mat="alu"] { --tube-hi: #f4f6f7; --tube-lo: #aeb8bf; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 14px/1.5 var(--display);
}
.page {
  max-width: 1240px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 56px;
}
h1, h2, h3 { margin: 0; font-family: var(--display); text-wrap: balance; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

/* Záhlaví: název, výkres trubky (bokorys a průřez) a parametry jako popisek na výkresu */
.masthead {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, 620px);
  grid-template-areas: "title fig" "spec spec";
  gap: 24px 32px;
  align-items: end;
  padding-top: 32px;
}
.masthead .title { grid-area: title; min-width: 0; }
.masthead h1 { font-weight: 800; font-size: clamp(36px, 5.6vw, 65px); line-height: .94; letter-spacing: -.035em; }
.masthead p { margin: 14px 0 0; font-size: clamp(14px, 1.6vw, 18px); color: var(--ink-soft); max-width: 46ch; }
.drawing { grid-area: fig; width: 100%; height: auto; display: block; }
.spec {
  grid-area: spec;
  margin: 0;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--ink);
  border-radius: 0;
  overflow: hidden;
}
.spec > div { background: var(--sheet); padding: 10px 14px 11px; min-width: 0; }
.spec dt { font-size: 12px; font-weight: 600; color: var(--ink-soft); }
.spec dd { margin: 2px 0 0; font: 700 16px/1.25 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 800px) {
  .masthead { grid-template-columns: minmax(0, 1fr); grid-template-areas: "title" "fig" "spec"; }
}
@media (max-width: 700px) {
  .spec { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .spec > div:last-child:nth-child(odd) { grid-column: 1 / -1; }
}

/* Rozložení */
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 380px) minmax(0, 1fr);
  gap: 40px;
  align-items: start;
  margin-top: 28px;
}
@media (max-width: 900px) { .workspace { grid-template-columns: minmax(0, 1fr); gap: 32px; } }

/* Zadání */
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 0; padding: 20px; display: grid; gap: 18px; }
.panel h2 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.label { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.fields { display: grid; }
.seg-choice { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 8px; }
.seg-choice legend { padding: 0; margin-bottom: 8px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choices label { position: relative; cursor: pointer; }
.choices input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.choices span {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 12px; min-height: 48px;
  border: 1px solid var(--rule); border-radius: 0;
  font-weight: 700; font-size: 14px;
  background: var(--paper); color: var(--ink);
}
.choices span::before {
  content: ""; flex: none; width: 20px; height: 20px; border-radius: 50%;
  background: radial-gradient(circle, var(--sheet) 0 36%, var(--c) 39% 100%);
  box-shadow: 0 0 0 1px var(--ink);
}
.choices label:first-child span { --c: #5f6a66; }
.choices label:last-child span { --c: #d9dedd; }
.choices input:checked + span { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.choices input:focus-visible + span { outline: 3px solid var(--ink); outline-offset: 2px; }
.choices input:not(:checked) + span:hover { border-color: var(--ink); }

.pieces { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 10px minmax(0, 1fr) minmax(0, 1.3fr) 40px; gap: 10px; align-items: center; }
.prow.headrow { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.swatch { width: 10px; height: 28px; border-radius: 0; background: var(--rule); }
input[type="number"], textarea {
  width: 100%;
  font: 500 16px var(--mono);
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 0 12px;
  height: 46px;
}
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input:hover, textarea:hover { border-color: var(--ink-soft); }
input:focus-visible, textarea:focus-visible { border-color: var(--ink); }
input::placeholder, textarea::placeholder { color: var(--ink-soft); opacity: .75; }
.unit, .cnt { position: relative; }
.unit input { padding-right: 44px; }
.cnt input { padding-right: 38px; }
.unit::after, .cnt::after {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  font: 500 13px var(--mono); color: var(--ink-soft); pointer-events: none;
}
.unit::after { content: "mm"; }
.cnt::after { content: "ks"; }

button {
  font: 700 14px var(--display);
  min-height: 44px;
  padding: 0 16px;
  border-radius: 0;
  border: 1px solid var(--rule);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}
button:hover { border-color: var(--ink); }
button.icon { padding: 0; width: 40px; height: 46px; font-size: 20px; line-height: 1; color: var(--ink-soft); }
button.icon:hover { color: var(--danger); border-color: var(--danger); }
button.primary {
  width: 100%; min-height: 54px;
  background: var(--signal); color: var(--on-signal);
  border: 0; font-size: 16px; font-weight: 800; letter-spacing: -.005em;
  box-shadow: 0 3px 0 var(--signal-edge);
}
button.primary:hover { background: var(--signal-hover); }
button.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--signal-edge); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.error { margin: 0; padding: 10px 12px; border-left: 4px solid var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--ink); font-weight: 600; font-size: 14px; }

.bulk { display: grid; gap: 10px; padding-top: 18px; border-top: 1px solid var(--rule); }
.bulk textarea { height: auto; min-height: 112px; padding: 10px 12px; font-size: 16px; resize: vertical; line-height: 1.5; }
.hint { font-size: 13px; color: var(--ink-soft); margin: 0; }
.h2-note { font: 400 13px var(--display); color: var(--ink-soft); letter-spacing: 0; }

/* Výsledek */
.results { display: grid; gap: 36px; min-width: 0; }
.verdict { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
@media (max-width: 640px) { .verdict { grid-template-columns: minmax(0, 1fr); } }
.answer { background: var(--signal); color: var(--on-signal); border-radius: 0; padding: 20px 24px 22px; display: grid; gap: 4px; align-content: space-between; }
.answer .label { color: var(--on-signal); font-size: 14px; }
.answer .big { font: 800 clamp(76px, 13vw, 126px)/.85 var(--display); letter-spacing: -.05em; padding-top: 12px; }
.answer .big small { font: 700 clamp(22px, 3vw, 29px) var(--display); letter-spacing: 0; margin-left: 6px; }
.facts { margin: 0; display: grid; align-content: stretch; border-top: 2px solid var(--ink); }
.facts > div { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 12px 2px; border-bottom: 1px solid var(--rule); }
.facts dt { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.facts dd { margin: 0; font: 700 clamp(23px, 3.2vw, 32px)/1.1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

.results h2 { font-size: 22px; font-weight: 800; letter-spacing: -.015em; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.plan > h2, .overview > h2 { position: relative; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.plan > h2::after, .overview > h2::after { content: ""; position: absolute; left: 0; bottom: -1px; width: 60px; height: 3px; background: var(--signal); }
.plan { display: grid; gap: 14px; }
.plan > h2 { margin-bottom: 4px; }
.pat { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 0 20px; padding: 20px 24px 22px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 0; box-shadow: 0 1px 0 var(--rule); }
.mult { font: 800 41px/1 var(--display); letter-spacing: -.04em; padding-top: 2px; }
.pat-body { min-width: 0; display: grid; gap: 0; }
.pat-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 20px; }
.pat-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.pat-title h3 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.pat-title span { color: var(--ink-soft); font-size: 13px; }
.rest { display: flex; align-items: baseline; gap: 8px; }
.rest small { color: var(--ink-soft); font-size: 13px; font-weight: 600; }
.rest b { font: 700 14px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Trubka v měřítku: délka pruhu odpovídá 6 000 mm, popisky prořezu nahoře, pravítko dole */
.tube { margin-top: 6px; }
.cutlabels { position: relative; height: 22px; }
.cutlabel { position: absolute; bottom: 6px; transform: translateX(-50%); font: 700 12px/1 var(--mono); color: var(--ink-soft); white-space: nowrap; }
.cutlabel::after { content: ""; position: absolute; left: 50%; top: calc(100% + 1px); width: 1px; height: 5px; background: var(--ink-soft); }
.cutlabel.no-label { visibility: hidden; }
.bar {
  position: relative; display: flex; height: 50px; border-radius: 0; overflow: hidden;
  background: var(--sheet);
  box-shadow: 0 0 0 1px var(--ink);
}
.bar::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to bottom, rgba(255,255,255,.40) 0, rgba(255,255,255,.07) 30%, rgba(0,0,0,0) 55%, rgba(0,0,0,.26) 100%);
}
.seg { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; white-space: nowrap; font: 700 13px var(--mono); }
.kerf { position: relative; }
.kerf::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; transform: translateX(-50%); background: var(--sheet); z-index: 1; }
.seg.rest-seg { background: repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 8px), var(--sheet); }
.ruler { position: relative; height: 26px; border-top: 1px solid var(--ink-soft); margin-top: 3px; }
.tick { position: absolute; top: 0; width: 1px; height: 5px; background: var(--ink-soft); }
.tick.major { height: 9px; }
.tick i { position: absolute; top: 11px; left: 0; transform: translateX(-50%); font: 500 12px/1 var(--mono); font-style: normal; color: var(--ink-soft); white-space: nowrap; }
.tick.first i { transform: none; }
.tick.last i { transform: translateX(-100%); }
.cuts { margin-top: 8px; font: 500 14px/1.5 var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
@media (max-width: 600px) {
  .pat { grid-template-columns: 56px minmax(0, 1fr); gap: 0 12px; padding: 16px 14px 18px; }
  .mult { font-size: 29px; }
  .bar { height: 44px; }
}

/* Přehled délek */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 12px 10px; border-bottom: 1px solid var(--rule); text-align: left; }
th { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
td.n, th.n { text-align: right; }
td.n, .overview td.mono { white-space: nowrap; }
.overview td:nth-child(2) { white-space: nowrap; }
.overview .c-qty { width: 22%; }
.overview .sw { display: inline-block; vertical-align: -4px; margin-right: 10px; width: 10px; height: 20px; border-radius: 0; }
tfoot td { font-weight: 700; border-bottom: 0; }
tfoot .sum-label td { border-top: 2px solid var(--ink); padding-bottom: 0; font: 600 13px var(--display); color: var(--ink-soft); }
@media (max-width: 600px) { .overview .c-qty { width: auto; } th, td { padding: 11px 6px; } }

.out-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; }
.out-actions button { min-width: 180px; min-height: 50px; font-size: 14px; }
.out-actions button.primary { width: auto; font-size: 14px; padding: 0 24px; }

/* Prázdný stav ukazuje, jak bude výsledek vypadat */
.empty { border: 1px dashed var(--ink-soft); border-radius: 0; padding: 28px clamp(16px, 3vw, 32px) 32px; display: grid; gap: 22px; }
.empty .hd { display: grid; gap: 6px; }
.empty strong { font: 800 23px/1.15 var(--display); letter-spacing: -.015em; }
.empty .hd span { color: var(--ink-soft); max-width: 52ch; }
.empty .tube { opacity: .85; }
.empty button { justify-self: start; }

@media (prefers-reduced-motion: no-preference) {
  button, input, textarea, .choices span { transition: border-color .15s ease, background-color .15s ease; }
}
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
    color-scheme: light;
    --paper: #fff; --sheet: #fff; --ink: #111; --ink-soft: #444; --rule: #ccc;
    --hatch: rgba(0, 0, 0, .18); --tube-hi: #c3cac7; --tube-lo: #68726e;
  }
  .page { max-width: none; padding-inline: 0; padding-block: 0; }
  .workspace { display: block; margin-top: 16px; }
  #form, .out-actions, .empty button { display: none !important; }
  .masthead { padding-top: 0; }
  .pat, .verdict, .overview { break-inside: avoid; }
  .results { gap: 24px; }
}
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="title">
      <h1>Kalkulace trubek</h1>
      <p id="subtitle">Ocelové lešenářské trubky nařežeme na míru z originální délky 6000 mm</p>
    </div>
    <svg class="drawing" id="cross" viewBox="0 0 600 190" role="img" aria-label="Trubka Ø 48,3 mm, délka 6 000 mm: bokorys a průřez">
      <defs>
        <linearGradient id="gSide" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:var(--tube-lo)"/>
          <stop offset=".28" style="stop-color:var(--tube-hi)"/>
          <stop offset="1" style="stop-color:var(--tube-lo)"/>
        </linearGradient>
        <linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" style="stop-color:var(--tube-hi)"/>
          <stop offset="1" style="stop-color:var(--tube-lo)"/>
        </linearGradient>
      </defs>
      <!-- osy -->
      <path d="M484 92H596M540 20V164" fill="none" style="stroke:var(--ink-soft)" stroke-width="1" stroke-dasharray="12 3 2 3"/>
      <!-- bokorys: celá trubka, výška odpovídá průměru, vlevo otevřený konec -->
      <path d="M14 42H470A8 50 0 0 1 470 142H14Z" fill="url(#gSide)" style="stroke:var(--ink)" stroke-width="1.4" stroke-linejoin="round"/>
      <ellipse cx="14" cy="92" rx="8" ry="50" style="fill:var(--tube-lo);stroke:var(--ink)" stroke-width="1.4"/>
      <ellipse cx="14" cy="92" rx="4.6" ry="41.6" style="fill:var(--paper);stroke:var(--ink)" stroke-width="1"/>
      <!-- kóta délky -->
      <path d="M6 148V176M478 148V176" fill="none" style="stroke:var(--ink)" stroke-width="1"/>
      <path d="M10 168H190M298 168H474" fill="none" style="stroke:var(--ink)" stroke-width="1.2"/>
      <path d="M6 168l9-3.5v7zM478 168l-9-3.5v7z" style="fill:var(--ink)"/>
      <text x="244" y="174" text-anchor="middle" style="fill:var(--ink)" font-family="JetBrains Mono, monospace" font-weight="700" font-size="19">6 000 mm</text>
      <!-- průřez -->
      <circle id="ringBody" cx="540" cy="92" r="45.8" fill="none" stroke="url(#gRing)" stroke-width="8.4"/>
      <circle cx="540" cy="92" r="50" fill="none" style="stroke:var(--ink)" stroke-width="1.4"/>
      <circle id="ringHole" cx="540" cy="92" r="41.6" fill="none" style="stroke:var(--ink)" stroke-width="1.4"/>
      <text x="540" y="174" text-anchor="middle" style="fill:var(--ink)" font-family="JetBrains Mono, monospace" font-weight="700" font-size="19">Ø 48,3</text>
    </svg>
    <dl class="spec" aria-label="Parametry trubky">
      <div><dt>Materiál</dt><dd id="specMat">Ocel</dd></div>
      <div><dt>Průměr</dt><dd>Ø 48,3 mm</dd></div>
      <div><dt>Stěna</dt><dd id="specWall">4,05 mm</dd></div>
      <div><dt>Délka</dt><dd>6 000 mm</dd></div>
      <div><dt>Prořez</dt><dd>3 mm</dd></div>
    </dl>
  </header>

  <main class="workspace">
    <form class="panel" id="form" autocomplete="off">
      <h2>Co potřebujete nařezat</h2>
      <div class="fields">
        <fieldset class="seg-choice">
          <legend class="label">Materiál</legend>
          <div class="choices">
            <label><input type="radio" name="mat" id="matSteel" value="Ocel" checked><span>Ocel</span></label>
            <label><input type="radio" name="mat" id="matAlu" value="Hliník"><span>Hliník</span></label>
          </div>
        </fieldset>
      </div>

      <div class="pieces">
        <div class="prow headrow"><span></span><span>Počet</span><span>Délka trubky</span><span></span></div>
        <div id="rows" class="pieces"></div>
      </div>
      <div class="actions">
        <button type="button" id="addRow">+ Přidat délku</button>
        <button type="button" id="clear">Vymazat</button>
      </div>

      <p class="error" id="error" role="alert" hidden></p>
      <button type="submit" class="primary">Vypočítat</button>

      <div class="bulk">
        <label class="label" for="bulk">Vložit seznam z textu <span class="h2-note" style="display:block;margin-top:2px">(délky zadávej vždy v milimetrech)</span></label>
        <textarea id="bulk" placeholder="10 × 3740&#10;12 × 2465&#10;23 × 860"></textarea>
        <p class="hint">Na každý řádek počet kusů a délka, např. „10 × 3740“ nebo „10 3740“.</p>
        <div class="actions">
          <button type="button" id="bulkApply">Nahrát seznam</button>
        </div>
      </div>
    </form>

    <section class="results" id="results" aria-live="polite"></section>
  </main>
</div>

<script>
(function () {
  "use strict";

  var COLORS = ["#316bf3", "#f64e7a", "#ffb422", "#1fa383", "#70cfe3", "#7b4bc4", "#e5762b", "#5b6b76", "#9a6a3a", "#8aa82b"];
  var STORE_KEY = "rezaci-plan-v2";
  var KERF = 3; // prořez pilou v mm, pevně daný
  var STOCK = 6000; // délka trubky v mm, pevně daná
  var OUTER_D = 48.3; // vnější průměr trubky v mm
  var WALL_STEEL = 4.05, WALL_ALU = 4.0; // tloušťka stěny v mm
  var EXAMPLE = [[3740, 10], [2465, 12], [860, 23]]; // [délka, počet]

  var rowsEl = document.getElementById("rows");
  var resultsEl = document.getElementById("results");
  var errorEl = document.getElementById("error");

  function fmt(n) {
    var r = Math.round(n * 10) / 10;
    return r.toLocaleString("cs-CZ", { maximumFractionDigits: 1 });
  }
  function textOn(hex) {
    var c = parseInt(hex.slice(1), 16);
    var r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) > 165 ? "#1b1b1b" : "#ffffff";
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // stejné délky sloučí: [548, 548, 440] → "2 ks 548 mm | 1 ks 440 mm"
  function piecesText(pieces) {
    var parts = [];
    pieces.forEach(function (l) {
      var last = parts[parts.length - 1];
      if (last && last.len === l) last.n++;
      else parts.push({ len: l, n: 1 });
    });
    return parts.map(function (p) { return p.n + " ks " + fmt(p.len) + " mm"; }).join(" | ");
  }

  /* ---------- Rows ---------- */
  function addRow(len, qty) {
    var row = el("div", "prow");
    var sw = el("span", "swatch");
    var lenWrap = el("span", "unit");
    var lenIn = el("input");
    lenIn.type = "number"; lenIn.min = "1"; lenIn.step = "1"; lenIn.placeholder = "délka";
    lenIn.className = "len"; lenIn.value = len != null ? len : "";
    lenIn.setAttribute("aria-label", "Délka trubky v mm");
    lenIn.inputMode = "numeric";
    lenWrap.appendChild(lenIn);
    var qtyWrap = el("span", "cnt");
    var qtyIn = el("input");
    qtyIn.type = "number"; qtyIn.min = "1"; qtyIn.step = "1"; qtyIn.placeholder = "počet";
    qtyIn.className = "qty"; qtyIn.value = qty != null ? qty : "";
    qtyIn.setAttribute("aria-label", "Počet kusů");
    qtyIn.inputMode = "numeric";
    qtyWrap.appendChild(qtyIn);
    var del = el("button", "icon", "×");
    del.type = "button";
    del.setAttribute("aria-label", "Odebrat řádek");
    del.addEventListener("click", function () { row.remove(); recolor(); save(); });
    row.append(sw, qtyWrap, lenWrap, del);
    rowsEl.appendChild(row);
    lenIn.id = "len-" + rowsEl.children.length;
    qtyIn.id = "qty-" + rowsEl.children.length;
    recolor();
    return row;
  }
  function setRows(list) {
    rowsEl.innerHTML = "";
    list.forEach(function (p) { addRow(p[0], p[1]); });
    if (!list.length) addRow();
  }
  function readRows() {
    return Array.prototype.map.call(rowsEl.children, function (r) {
      return [parseFloat(r.querySelector(".len").value), parseInt(r.querySelector(".qty").value, 10)];
    });
  }
  function colorMap(lengths) {
    var map = {}, i = 0;
    lengths.forEach(function (l) {
      if (!(l in map) && isFinite(l) && l > 0) { map[l] = COLORS[i % COLORS.length]; i++; }
    });
    return map;
  }
  function recolor() {
    var lens = readRows().map(function (p) { return p[0]; });
    var map = colorMap(lens);
    Array.prototype.forEach.call(rowsEl.children, function (r, idx) {
      var c = map[lens[idx]];
      r.querySelector(".swatch").style.background = c || "var(--rule)";
    });
  }
  rowsEl.addEventListener("input", function () { recolor(); save(); });

  /* ---------- Solver ----------
     Každý kus spotřebuje (délka + prořez). Protože za posledním kusem se
     prořez nepočítá, má trubka efektivní kapacitu (délka trubky + prořez). */
  function solve(stock, kerf, demand) {
    // demand: [{len, qty}], délky v mm; počítáme v desetinách mm
    var S = 10;
    var cap = Math.round((stock + kerf) * S);
    var types = demand.map(function (d) {
      return { len: d.len, qty: d.qty, w: Math.round((d.len + kerf) * S) };
    });
    var totalW = types.reduce(function (s, t) { return s + t.w * t.qty; }, 0);
    var lower = Math.ceil(totalW / cap - 1e-9);

    function knapsackPattern(rem, order) {
      var dp = new Int32Array(cap + 1).fill(-1);
      dp[0] = -2;
      for (var oi = 0; oi < order.length; oi++) {
        var ti = order[oi], t = types[ti];
        var copies = Math.min(rem[ti], Math.floor(cap / t.w));
        for (var k = 0; k < copies; k++) {
          for (var c = cap; c >= t.w; c--) {
            if (dp[c] === -1 && dp[c - t.w] !== -1) dp[c] = ti;
          }
        }
      }
      var best = cap;
      while (best > 0 && dp[best] === -1) best--;
      var counts = new Array(types.length).fill(0);
      var c2 = best;
      while (c2 > 0) { var ti2 = dp[c2]; counts[ti2]++; c2 -= types[ti2].w; }
      return counts;
    }

    function greedy(order) {
      var rem = types.map(function (t) { return t.qty; });
      var bars = [];
      var left = rem.reduce(function (a, b) { return a + b; }, 0);
      while (left > 0) {
        var counts = knapsackPattern(rem, order);
        var times = Infinity;
        counts.forEach(function (n, i) { if (n) times = Math.min(times, Math.floor(rem[i] / n)); });
        if (!isFinite(times) || times < 1) break;
        for (var r = 0; r < times; r++) bars.push(counts.slice());
        counts.forEach(function (n, i) { rem[i] -= n * times; left -= n * times; });
      }
      return bars;
    }

    function ffd(bestFit) {
      var list = [];
      types.forEach(function (t, i) { for (var k = 0; k < t.qty; k++) list.push(i); });
      list.sort(function (a, b) { return types[b].w - types[a].w; });
      var bins = [];
      list.forEach(function (ti) {
        var w = types[ti].w, pick = -1;
        for (var b = 0; b < bins.length; b++) {
          if (bins[b].free >= w) {
            if (!bestFit) { pick = b; break; }
            if (pick < 0 || bins[b].free < bins[pick].free) pick = b;
          }
        }
        if (pick < 0) { bins.push({ free: cap, counts: new Array(types.length).fill(0) }); pick = bins.length - 1; }
        bins[pick].free -= w;
        bins[pick].counts[ti]++;
      });
      return bins.map(function (b) { return b.counts; });
    }

    function score(bars) {
      // méně tyčí je lepší; při shodě chceme odpad soustředěný do co nejmenšího počtu velkých zbytků
      var sq = 0;
      bars.forEach(function (c) {
        var used = c.reduce(function (s, n, i) { return s + n * types[i].w; }, 0);
        var f = (cap - used) / cap;
        sq += f * f;
      });
      return bars.length * 1e6 - sq;
    }

    var base = types.map(function (_, i) { return i; }).sort(function (a, b) { return types[b].w - types[a].w; });
    var candidates = [greedy(base), greedy(base.slice().reverse()), ffd(false), ffd(true)];
    var seed = 12345;
    function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    var tries = types.length > 1 ? 40 : 0;
    for (var t = 0; t < tries; t++) {
      var o = base.slice();
      for (var i = o.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var tmp = o[i]; o[i] = o[j]; o[j] = tmp; }
      candidates.push(greedy(o));
    }
    var best = null, bestScore = Infinity;
    candidates.forEach(function (c) {
      var s = score(c);
      if (s < bestScore) { bestScore = s; best = c; }
    });

    // Přesné ověření: zkusíme najít řešení s menším počtem tyčí (výčet
    // maximálních vzorů + prohledávání s pamětí, omezené rozpočtem kroků).
    var proven = best.length === lower;
    var exact = exactSearch(best.length);
    if (exact.bars) { best = exact.bars; proven = exact.proven; }
    else if (exact.proven) proven = true;

    function exactSearch(n) {
      var nT = types.length, pats = [], budget = 300000, aborted = false;
      (function gen(i, capLeft, cur) {
        if (pats.length > 4000) { aborted = true; return; }
        if (i === nT) { if (cur.some(Boolean)) pats.push(cur.slice()); return; }
        for (var k = Math.min(types[i].qty, Math.floor(capLeft / types[i].w)); k >= 0; k--) {
          cur[i] = k; gen(i + 1, capLeft - k * types[i].w, cur);
        }
        cur[i] = 0;
      })(0, cap, new Array(nT).fill(0));
      if (aborted) return {};
      pats = pats.filter(function (p) {
        return !pats.some(function (q) { return q !== p && q.every(function (v, j) { return v >= p[j]; }) && q.some(function (v, j) { return v > p[j]; }); });
      });
      var memo = new Map();
      function can(rem, k) {
        if (rem.every(function (r) { return r === 0; })) return [];
        if (k === 0 || aborted) return null;
        if (--budget < 0) { aborted = true; return null; }
        var need = rem.reduce(function (s, r, j) { return s + r * types[j].w; }, 0);
        if (need > k * cap) return null;
        var key = rem.join(",") + "/" + k;
        if (memo.has(key)) return null;
        var i = rem.findIndex(function (r) { return r > 0; });
        for (var pi = 0; pi < pats.length; pi++) {
          var p = pats[pi];
          if (!p[i]) continue;
          var take = rem.map(function (r, j) { return Math.min(r, p[j]); });
          var sub = can(rem.map(function (r, j) { return r - take[j]; }), k - 1);
          if (sub) { sub.push(take); return sub; }
        }
        memo.set(key, true);
        return null;
      }
      var found = null, target = n - 1;
      while (target >= lower) {
        var r = can(types.map(function (t) { return t.qty; }), target);
        if (!r) break;
        found = r; target--;
      }
      if (aborted) return { bars: found, proven: false };
      return { bars: found, proven: true };
    }

    var bars = best.map(function (counts) {
      var pieces = [];
      counts.forEach(function (n, i) { for (var k = 0; k < n; k++) pieces.push(types[i].len); });
      pieces.sort(function (a, b) { return b - a; });
      var used = pieces.reduce(function (s, l) { return s + l; }, 0) + Math.max(0, pieces.length - 1) * kerf;
      // zbývá-li kus materiálu, odřízne se od něj poslední kus dalším prořezem
      var leftover = Math.round((stock - used) * 10) / 10;
      var endCut = leftover > 0 && kerf > 0;
      return { pieces: pieces, endCut: endCut, rest: Math.max(0, Math.round((leftover - (endCut ? kerf : 0)) * 10) / 10) };
    });
    return { bars: bars, lower: lower, proven: proven };
  }

  /* ---------- Render ---------- */
  function render(stock, kerf, demand, res) {
    resultsEl.innerHTML = "";
    var colors = colorMap(demand.map(function (d) { return d.len; }));
    var bars = res.bars;

    // seskupení stejných nářezů
    var groups = [], byKey = {};
    bars.forEach(function (b) {
      var key = b.pieces.join("|");
      if (!byKey[key]) { byKey[key] = { pieces: b.pieces, endCut: b.endCut, rest: b.rest, count: 0 }; groups.push(byKey[key]); }
      byKey[key].count++;
    });
    groups.sort(function (a, b) { return b.count - a.count || a.rest - b.rest; });

    var totalPieces = demand.reduce(function (s, d) { return s + d.qty; }, 0);
    var totalLen = demand.reduce(function (s, d) { return s + d.len * d.qty; }, 0);
    var totalRest = bars.reduce(function (s, b) { return s + b.rest; }, 0);

    updateSubtitle();

    // odpověď a souhrn
    var verdict = el("section", "verdict");
    var answer = el("div", "answer");
    answer.append(el("span", "label", "Celkový počet trubek k nařezání"));
    var big = el("b", "big", String(bars.length));
    big.append(el("small", null, "ks"));
    answer.append(big);
    var facts = el("dl", "facts");
    function fact(label, value) {
      var d = el("div");
      d.append(el("dt", null, label), el("dd", null, value));
      facts.append(d);
    }
    fact("Požadované kusy", totalPieces + " ks");
    fact("Zbytkový materiál", fmt(totalRest) + " mm");
    verdict.append(answer, facts);
    resultsEl.append(verdict);

    // plán řezání
    var plan = el("section", "plan");
    var ph = el("h2", null, "Plán řezání ");
    ph.append(el("span", "h2-note", "(stejné nářezy jsou sloučené, pruh odpovídá délce 6 000 mm)"));
    plan.append(ph);
    var from = 1;
    groups.forEach(function (g) {
      var to = from + g.count - 1;
      var card = el("article", "pat");
      card.append(el("div", "mult", g.count + "×"));

      var body = el("div", "pat-body");
      var head = el("div", "pat-head");
      var title = el("div", "pat-title");
      title.append(el("h3", null, g.count === 1 ? "Trubka " + from : "Trubky " + from + "–" + to));
      title.append(el("span", null, g.pieces.length + (g.pieces.length === 1 ? " kus" : g.pieces.length < 5 ? " kusy" : " kusů") + " z každé trubky"));
      var rest = el("div", "rest");
      rest.append(el("small", null, "Odřezek"), el("b", null, fmt(g.rest) + " mm"));
      head.append(title, rest);
      body.append(head);

      var tube = el("div", "tube");
      var labels = el("div", "cutlabels");
      labels.setAttribute("aria-hidden", "true");
      var bar = el("div", "bar");
      bar.setAttribute("role", "img");
      bar.setAttribute("aria-label", piecesText(g.pieces) + ", odřezek " + fmt(g.rest) + " mm");
      var pos = 0; // mm od začátku trubky
      function cut() {
        var k = el("span", "kerf");
        k.style.flex = kerf + " 1 0";
        k.title = "prořez " + fmt(kerf) + " mm";
        bar.append(k);
        var lb = el("span", "cutlabel", fmt(kerf) + " mm");
        lb.style.left = ((pos + kerf / 2) / stock * 100) + "%";
        labels.append(lb);
        pos += kerf;
      }
      g.pieces.forEach(function (p, i) {
        if (i > 0 && kerf > 0) cut();
        var s = el("span", "seg");
        s.style.flex = p + " 1 0";
        s.style.background = colors[p];
        s.style.color = textOn(colors[p]);
        s.title = fmt(p) + " mm";
        s.textContent = p / stock > 0.09 ? fmt(p) : "";
        bar.append(s);
        pos += p;
      });
      if (g.endCut && kerf > 0) cut();
      if (g.rest > 0) {
        var r = el("span", "seg rest-seg");
        r.style.flex = g.rest + " 1 0";
        r.title = "odřezek " + fmt(g.rest) + " mm";
        bar.append(r);
      }
      tube.append(labels, bar, makeRuler(stock));
      body.append(tube);
      body.append(el("div", "cuts", piecesText(g.pieces)));
      card.append(body);
      plan.append(card);
      from = to + 1;
    });
    resultsEl.append(plan);
    layoutKerfLabels();

    // přehled délek
    var tp = el("section", "overview");
    var th2 = el("h2", null, "Přehled délek ");
    th2.append(el("span", "h2-note", "(seřazeno od největší po nejmenší)"));
    tp.append(th2);
    var tw = el("div", "tablewrap");
    var table = el("table");
    table.innerHTML = "<thead><tr><th class=\"c-qty\">Počet</th><th class=\"c-len\">Délka</th><th class=\"n\">Celková délka</th></tr></thead>";
    var tb = el("tbody");
    demand.slice().sort(function (a, b) { return b.len - a.len; }).forEach(function (d) {
      var tr = el("tr");
      var td = el("td", "mono");
      var sw = el("span", "sw");
      sw.style.background = colors[d.len];
      td.append(sw, document.createTextNode(fmt(d.len) + " mm"));
      tr.append(el("td", "mono c-qty", d.qty + " ks"), td, el("td", "n mono", fmt(d.len * d.qty) + " mm"));
      tb.append(tr);
    });
    table.append(tb);
    var tf = el("tfoot");
    var ltr = el("tr", "sum-label");
    var ltd = el("td", null, "Celkový počet požadovaných trubek");
    ltd.colSpan = 3;
    ltr.append(ltd);
    tf.append(ltr);
    var ftr = el("tr");
    ftr.append(el("td", "mono c-qty", totalPieces + " ks"), el("td"), el("td", "n mono", fmt(totalLen) + " mm"));
    tf.append(ftr);
    table.append(tf);
    tw.append(table);
    tp.append(tw);
    resultsEl.append(tp);

    // Odeslat e-mailem / Vytisknout (v náhledu na claude.ai prohlížeč tisk ani e-mail nepustí, proto tam tlačítka skryjeme)
    var embedded = false;
    try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
    if (!embedded) {
      var out = el("div", "actions out-actions");
      var mail = el("button", "primary", "Odeslat e-mailem");
      mail.type = "button";
      mail.addEventListener("click", function () {
        var spec = document.getElementById("matAlu").checked ? "Hliníková trubka Ø 48,3 mm, tloušťka stěny 4,00 mm" : "Ocelová lešenářská trubka Ø 48,3 mm, tloušťka stěny 4,05 mm";
        var lines = [spec, "Prořez " + fmt(kerf) + " mm, délka trubky " + fmt(stock) + " mm", ""];
        lines.push("Celkem je potřeba " + bars.length + " trubek.");
        lines.push("Požadované kusy: " + totalPieces + " ks, zbytkový materiál: " + fmt(totalRest) + " mm", "");
        var f = 1;
        groups.forEach(function (g) {
          var t2 = f + g.count - 1;
          lines.push(g.count + "× " + (g.count === 1 ? "Trubka " + f : "Trubky " + f + "–" + t2) + ": " +
            piecesText(g.pieces) + ", odřezek " + fmt(g.rest) + " mm");
          f = t2 + 1;
        });
        lines.push("", "Přehled délek:");
        demand.slice().sort(function (a, b) { return b.len - a.len; }).forEach(function (d) {
          lines.push(d.qty + " × " + fmt(d.len) + " mm");
        });
        location.href = "mailto:?subject=" + encodeURIComponent("Kalkulace trubek – " + bars.length + " trubek") +
          "&body=" + encodeURIComponent(lines.join("\n"));
      });
      var print = el("button", null, "Vytisknout");
      print.type = "button";
      print.addEventListener("click", function () { window.print(); });
      out.append(print, mail);
      resultsEl.append(out);
    }
  }

  // pravítko po 500 mm, popisky po metrech; ukazuje stejné měřítko jako pruh trubky
  function makeRuler(stock) {
    var ruler = el("div", "ruler");
    ruler.setAttribute("aria-hidden", "true");
    for (var m = 0; m <= stock; m += 500) {
      var major = m % 1000 === 0;
      var t = el("span", "tick" + (major ? " major" : "") + (m === 0 ? " first" : "") + (m === stock ? " last" : ""));
      t.style.left = (m / stock * 100) + "%";
      if (major) t.append(el("i", null, (m / 1000) + (m === stock ? " m" : "")));
      ruler.append(t);
    }
    return ruler;
  }

  /* ---------- Flow ---------- */
  function calc() {
    errorEl.hidden = true;
    var stock = STOCK;
    var kerf = KERF;
    function fail(msg) { errorEl.textContent = msg; errorEl.hidden = false; }

    var agg = {}, order = [];
    var rows = readRows();
    for (var i = 0; i < rows.length; i++) {
      var l = rows[i][0], q = rows[i][1];
      if (!isFinite(l) && !isFinite(q)) continue;
      if (!(l > 0) || !(q > 0)) return fail("Řádek " + (i + 1) + ": vyplň délku i počet kusů.");
      if (l > stock) return fail("Kus " + fmt(l) + " mm je delší než trubka " + fmt(stock) + " mm.");
      if (!(l in agg)) { agg[l] = 0; order.push(l); }
      agg[l] += q;
    }
    if (!order.length) { showEmpty(); return fail("Přidej alespoň jednu délku kusu."); }
    var demand = order.map(function (l) { return { len: l, qty: agg[l] }; });
    if (demand.reduce(function (s, d) { return s + d.qty; }, 0) > 5000) return fail("Najednou lze spočítat nejvýše 5000 kusů.");
    render(stock, kerf, demand, solve(stock, kerf, demand));
    return true;
  }
  // na úzkém displeji je výsledek pod zadáním, proto se k němu po výpočtu posune stránka
  function revealResults() {
    if (!window.matchMedia("(max-width: 900px)").matches) return;
    var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    resultsEl.scrollIntoView({ behavior: calm ? "auto" : "smooth", block: "start" });
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        alu: document.getElementById("matAlu").checked,
        rows: readRows()
      }));
    } catch (e) { /* úložiště nemusí být dostupné */ }
  }
  function load() {
    try {
      var d = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (d && d.rows && d.rows.length) {
        document.getElementById(d.alu ? "matAlu" : "matSteel").checked = true;
        setRows(d.rows.map(function (r) { return [isFinite(r[0]) ? r[0] : "", isFinite(r[1]) ? r[1] : ""]; }));
        return true;
      }
    } catch (e) { /* ignorovat */ }
    return false;
  }

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault(); save();
    if (calc() === true) revealResults();
  });
  function matDesc() {
    return document.getElementById("matAlu").checked
      ? "Hliníkové trubky nařežeme na míru z originální délky 6000 mm"
      : "Ocelové lešenářské trubky nařežeme na míru z originální délky 6000 mm";
  }
  // záhlaví: popis, parametry a průřez trubky podle zvoleného materiálu
  function updateSubtitle() {
    var alu = document.getElementById("matAlu").checked;
    var wall = alu ? WALL_ALU : WALL_STEEL;
    var wallText = wall.toLocaleString("cs-CZ", { minimumFractionDigits: 2 });
    document.getElementById("subtitle").textContent = matDesc();
    document.getElementById("specMat").textContent = alu ? "Hliník" : "Ocel";
    document.getElementById("specWall").textContent = wallText + " mm";
    document.body.setAttribute("data-mat", alu ? "alu" : "steel");
    var k = 50 / (OUTER_D / 2); // průřez je nakreslený v měřítku, vnější poloměr 50
    var w = wall * k;
    var ring = document.getElementById("ringBody");
    ring.setAttribute("r", String(50 - w / 2));
    ring.setAttribute("stroke-width", String(w));
    document.getElementById("ringHole").setAttribute("r", String(50 - w));
    document.getElementById("cross").setAttribute("aria-label", "Trubka Ø " + fmt(OUTER_D) + " mm se stěnou " + wallText + " mm, délka " + fmt(STOCK) + " mm: bokorys a průřez");
  }
  ["matSteel", "matAlu"].forEach(function (id) {
    document.getElementById(id).addEventListener("change", function () { updateSubtitle(); save(); });
  });
  document.getElementById("addRow").addEventListener("click", function () { addRow().querySelector(".qty").focus(); });
  document.getElementById("clear").addEventListener("click", function () {
    setRows([]); showEmpty();  errorEl.hidden = true; save();
  });
  document.getElementById("bulkApply").addEventListener("click", function () {
    var list = [];
    document.getElementById("bulk").value.split(/\n+/).forEach(function (line) {
      var m = line.replace(",", ".").match(/(\d+(?:\.\d+)?)\D+(\d+(?:\.\d+)?)/);
      if (!m) return;
      // větší číslo je délka, menší počet kusů (pořadí na řádku nevadí)
      var a = parseFloat(m[1]), b = parseFloat(m[2]);
      list.push([Math.max(a, b), Math.round(Math.min(a, b))]);
    });
    if (!list.length) { errorEl.textContent = "V textu jsem nenašel žádnou dvojici délka + počet."; errorEl.hidden = false; return; }
    setRows(list); save();
    if (calc() === true) revealResults();
  });

  // Popisky prořezu, které by se překrývaly (u krátkých kusů), skryjeme
  function layoutKerfLabels() {
    Array.prototype.forEach.call(document.querySelectorAll(".cutlabels"), function (box) {
      // popisek jen tam, kde je sousední řez na obou stranách dost daleko;
      // mezi krátkými kusy se nezobrazí žádný
      var ls = box.querySelectorAll(".cutlabel");
      var xs = Array.prototype.map.call(ls, function (k) { return k.offsetLeft; });
      Array.prototype.forEach.call(ls, function (k, i) {
        var tight = (i > 0 && xs[i] - xs[i - 1] < 52) || (i < xs.length - 1 && xs[i + 1] - xs[i] < 52);
        k.classList.toggle("no-label", tight);
      });
    });
  }
  var resizeTimer;
  window.addEventListener("resize", function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(layoutKerfLabels, 100); });

  // prázdný stav: náznak pruhu trubky a tlačítko s ukázkovým zadáním
  function showEmpty() {
    resultsEl.innerHTML = "";
    var box = el("div", "empty");
    var hd = el("div", "hd");
    hd.append(el("strong", null, "Zatím žádný výpočet"));
    hd.append(el("span", null, "Zadejte počty kusů a jejich délky, pak klikněte na Vypočítat. Výsledek ukáže, jak nařezat každou trubku, a kolik zbude."));
    box.append(hd);
    var tube = el("div", "tube");
    tube.setAttribute("aria-hidden", "true");
    var bar = el("div", "bar");
    var rest = el("span", "seg rest-seg");
    rest.style.flex = "1 1 0";
    bar.append(rest);
    tube.append(el("div", "cutlabels"), bar, makeRuler(STOCK));
    box.append(tube);
    var demo = el("button", null, "Vyzkoušet na příkladu");
    demo.type = "button";
    demo.addEventListener("click", function () {
      setRows(EXAMPLE); save();
      if (calc() === true) revealResults();
    });
    box.append(demo);
    resultsEl.append(box);
  }

  var loaded = load();
  updateSubtitle();
  if (loaded && readRows().some(function (r) { return r[0] > 0 && r[1] > 0; })) calc();
  else { if (!rowsEl.children.length) setRows([[ "", "" ], [ "", "" ], [ "", "" ]]); showEmpty(); }
})();
</script>
