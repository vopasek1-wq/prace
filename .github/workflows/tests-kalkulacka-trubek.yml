name: Kalkulačka trubek – testy

# Testy řešiče (node:test, bez závislostí). Spouští se při změně složky kalkulačky.
on:
  push:
    paths:
      - kalkulacka-trubek/**
      - .github/workflows/tests-kalkulacka-trubek.yml
  pull_request:
    paths:
      - kalkulacka-trubek/**
      - .github/workflows/tests-kalkulacka-trubek.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "kalkulacka-trubek/test/*.test.js"
