name: Kalkulačka trubek – GitHub Pages

# Na Pages se nahrává jen složka kalkulacka-trubek (ostatní složky repozitáře se nezveřejňují).
# Adresa: https://<uživatel>.github.io/<repozitář>/kalkulacka-trubek/
# Jednorázově je potřeba v Settings → Pages nastavit Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - kalkulacka-trubek/index.html
      - .github/workflows/pages-kalkulacka-trubek.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}kalkulacka-trubek/
    steps:
      - uses: actions/checkout@v4

      - name: Připravit stránku
        run: |
          mkdir -p _site/kalkulacka-trubek
          cp kalkulacka-trubek/index.html _site/kalkulacka-trubek/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
